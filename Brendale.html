<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Utilities ── */
const REVEAL_SUPPORTED = typeof IntersectionObserver === 'function' && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const useScrollReveal = (threshold = 0.12) => {
  const ref = useRef(null);
  const [visible, setVisible] = useState(!REVEAL_SUPPORTED);
  useEffect(() => {
    if (!REVEAL_SUPPORTED) return;
    const el = ref.current;
    if (!el) { setVisible(true); return; }
    let obs;
    const failSafe = setTimeout(() => setVisible(true), 2500);
    try {
      obs = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { clearTimeout(failSafe); setVisible(true); obs.disconnect(); }
      }, { threshold });
      obs.observe(el);
    } catch (err) { clearTimeout(failSafe); setVisible(true); }
    return () => { clearTimeout(failSafe); if (obs) obs.disconnect(); };
  }, []);
  return [ref, visible];
};

const Reveal = ({ children, delay = 0, style = {} }) => {
  const [ref, visible] = useScrollReveal();
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(20px)',
      transition: `opacity 0.75s ease ${delay}s, transform 0.75s ease ${delay}s`,
      ...style,
    }}>{children}</div>
  );
};

const GoldRule = ({ style = {} }) => (
  <div style={{ width: 48, height: 2, background: '#C9A84C', ...style }} />
);

const SectionLabel = ({ children, dark = false, gold = false }) => (
  <div style={{
    fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 700,
    textTransform: 'uppercase', letterSpacing: '0.2em', marginBottom: 12,
    color: gold ? '#C9A84C' : dark ? 'rgba(255,255,255,0.4)' : 'rgba(0,66,37,0.4)',
  }}>{children}</div>
);

/* ── Header ── */
const navLink = { fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.42)', padding: '8px 14px', borderRadius: 6, textDecoration: 'none', transition: 'color 0.2s' };
const NAV_ITEMS = [
  { label: 'Property Owners', href: 'services.html', children: [['Commercial Property Management', 'services.html'], ['Commercial Property Leasing', 'leasing.html'], ['Locations', 'locations.html']] },
  { label: 'Buyers', href: 'buyers-agency.html' },
  { label: 'Tenants', href: 'tenant-representation.html' },
  { label: 'Market Intelligence', href: 'insights.html', children: [['Market Intelligence', 'insights.html'], ['Case Studies', 'case-studies.html'], ['Tools & Calculators', 'tools.html']] },
  { label: 'About', href: 'about.html', children: [['About', 'about.html'], ['Referrals', 'referrals.html'], ['Contact', 'contact.html']] }
];
const Header = () => {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const [openDrop, setOpenDrop] = useState(null);
  useEffect(() => { const fn = () => { if (window.innerWidth > 1080) setMenuOpen(false); setOpenDrop(null); }; window.addEventListener('resize', fn); return () => window.removeEventListener('resize', fn); }, []);
  useEffect(() => { const fn = e => { if (e.key === 'Escape') { setOpenDrop(null); setMenuOpen(false); } }; window.addEventListener('keydown', fn); return () => window.removeEventListener('keydown', fn); }, []);
  return (
    <header style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 200,
      background: scrolled ? 'rgba(0,45,24,0.97)' : 'transparent',
      borderBottom: scrolled ? '1px solid rgba(255,255,255,0.06)' : '1px solid transparent',
      height: 68, display: 'flex', alignItems: 'center', padding: '0 48px',
      backdropFilter: scrolled ? 'blur(12px)' : 'none',
      transition: 'background 0.4s ease, border-color 0.4s ease',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', maxWidth: 1320, margin: '0 auto' }}>
        <a href="index.html" style={{ textDecoration: 'none', textAlign: 'left' }}>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 38, fontWeight: 700, color: '#fff', textTransform: 'uppercase', letterSpacing: '0.06em', lineHeight: 1 }}>REPRESENT</div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 600, color: 'rgba(255,255,255,0.38)', textTransform: 'uppercase', letterSpacing: '0.35em', marginTop: 4 }}>COMMERCIAL</div>
        </a>
        <nav className={'pct-nav' + (menuOpen ? ' is-open' : '')} style={{ alignItems: 'center', gap: 2, flexWrap: 'nowrap' }} onClick={() => { setMenuOpen(false); setOpenDrop(null); }}>
          <a href="index.html" className="pct-nav__extra" style={navLink} onMouseEnter={e => e.currentTarget.style.color = '#fff'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.42)'}>Home</a>
          {NAV_ITEMS.map((item, i) => item.children ? (
            <div key={item.label} className={'pct-drop' + (openDrop === i ? ' is-open' : '')} onMouseEnter={() => setOpenDrop(i)} onMouseLeave={() => setOpenDrop(null)} onFocus={() => setOpenDrop(i)}>
              <a href={item.href} aria-haspopup="true" aria-expanded={openDrop === i} style={navLink} onMouseEnter={e => e.currentTarget.style.color = '#fff'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.42)'}>{item.label}</a>
              <div className="pct-drop__menu"><div className="pct-drop__panel">
                {item.children.map(([cl, ch]) => <a key={cl} href={ch}>{cl}</a>)}
              </div></div>
            </div>
          ) : (
            <a key={item.label} href={item.href} style={navLink} onMouseEnter={e => e.currentTarget.style.color = '#fff'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.42)'}>{item.label}</a>
          ))}
          <a href="contact.html" className="pct-nav__cta" style={{ background: '#C9A84C', fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 700, color: '#002D18', padding: '9px 22px', borderRadius: 8, marginLeft: 12, textDecoration: 'none', display: 'inline-block', transition: 'opacity 0.2s' }}
          onMouseEnter={e => e.currentTarget.style.opacity = '0.85'} onMouseLeave={e => e.currentTarget.style.opacity = '1'}>Discuss a Property</a>
        </nav>
        <button type="button" className="pct-burger" aria-label="Toggle menu" aria-expanded={menuOpen} onClick={() => setMenuOpen(o => !o)}>
          <span style={{ transform: menuOpen ? 'translateY(7px) rotate(45deg)' : 'none' }} />
          <span style={{ opacity: menuOpen ? 0 : 1 }} />
          <span style={{ transform: menuOpen ? 'translateY(-7px) rotate(-45deg)' : 'none' }} />
        </button>
      </div>
    </header>
  );
};
