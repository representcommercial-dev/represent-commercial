/* ── Shared Utilities ── */
const useScrollReveal = (threshold = 0.15) => {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
};

const Reveal = ({ children, delay = 0, style = {} }) => {
  const [ref, visible] = useScrollReveal();
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(22px)',
      transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
      ...style,
    }}>{children}</div>
  );
};

                        <label style={{ display: 'block', fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: '#4A504A', marginBottom: 6 }}>{f.label}</label>
                        <input type={f.type} placeholder={f.placeholder} value={form[f.id]} onChange={e => setForm({...form, [f.id]: e.target.value})} onFocus={() => setActive(f.id)} onBlur={() => setActive(null)} style={inp(f.id)} />
                      </div>
                    ))}
                  </div>
                  {[{ id: 'email', label: 'Email Address', placeholder: 'you@example.com', type: 'email' }, { id: 'address', label: 'Property Address', placeholder: '446 Sheridan St, Cairns North QLD', type: 'text' }, { id: 'value', label: 'Approx. Asset Value', placeholder: '$4,200,000', type: 'text' }].map(f => (
                    <div key={f.id} style={{ marginBottom: 14 }}>
                      <label style={{ display: 'block', fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: '#4A504A', marginBottom: 6 }}>{f.label}</label>
                      <input type={f.type} placeholder={f.placeholder} value={form[f.id]} onChange={e => setForm({...form, [f.id]: e.target.value})} onFocus={() => setActive(f.id)} onBlur={() => setActive(null)} style={inp(f.id)} />
                    </div>
                  ))}
                  <div style={{ marginBottom: 24 }}>
                    <label style={{ display: 'block', fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: '#4A504A', marginBottom: 6 }}>Additional Context</label>
                    <textarea rows={3} placeholder="Current management arrangement, specific concerns, timeline..." value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} onFocus={() => setActive('notes')} onBlur={() => setActive(null)} style={{ ...inp('notes'), resize: 'vertical' }} />
                  </div>
                  <button type="submit" style={{ width: '100%', background: '#004225', border: 'none', cursor: 'pointer', fontFamily: "'DM Sans', sans-serif", fontSize: 15, fontWeight: 700, color: '#fff', padding: '15px 0', borderRadius: 8, transition: 'opacity 0.2s' }}
                  onMouseEnter={e => e.currentTarget.style.opacity = '0.85'} onMouseLeave={e => e.currentTarget.style.opacity = '1'}>Submit request</button>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: '#8A918A', textAlign: 'center', marginTop: 14 }}>Nick responds personally within one business day.</div>
                </form>
              )}
            </div>
          </Reveal>
        </div>
      </section>
    </div>
  );
};

/* ── APP ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#C9A84C",
  "primaryGreen": "#004225",
  "darkGreen": "#002D18"
}/*EDITMODE-END*/;

const App = () => {
  const [page, setPage] = useState(() => localStorage.getItem('rc_page') || 'home');
  const [tweakOpen, setTweakOpen] = useState(false);

  useEffect(() => {
    localStorage.setItem('rc_page', page);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [page]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderPage = () => {
    switch (page) {
      case 'home':       return <HomePage setPage={setPage} />;
      case 'about':      return <AboutPage setPage={setPage} />;
      case 'services':   return <ServicesPage setPage={setPage} />;

      case 'contact':    return <ContactPage />;
      default:           return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Header page={page} setPage={setPage} />
      <main style={{ paddingTop: 68, flex: 1 }}>{renderPage()}</main>
      <Footer setPage={setPage} />

      {tweakOpen && (
        <div style={{ position: 'fixed', bottom: 24, right: 24, zIndex: 9999, background: '#002D18', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 14, padding: '24px', width: 260, boxShadow: '0 16px 48px rgba(0,0,0,0.5)' }}>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.2em', color: '#C9A84C', marginBottom: 20 }}>Tweaks</div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: 'rgba(255,255,255,0.5)', marginBottom: 12 }}>Navigate to page</div>
          {[['Home', 'home'], ['About', 'about'], ['Services', 'services'], ['Contact', 'contact']].map(([l, k]) => (
            <button key={k} onClick={() => setPage(k)} style={{ display: 'block', width: '100%', textAlign: 'left', background: page === k ? 'rgba(201,168,76,0.12)' : 'rgba(255,255,255,0.04)', border: `1px solid ${page === k ? 'rgba(201,168,76,0.3)' : 'rgba(255,255,255,0.08)'}`, borderRadius: 7, padding: '8px 12px', cursor: 'pointer', fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: page === k ? '#C9A84C' : 'rgba(255,255,255,0.6)', marginBottom: 6, transition: 'all 0.15s' }}>{l}</button>
          ))}
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);




</script>
</body>
</html>
